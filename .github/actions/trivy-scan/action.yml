name: Trivy scan (Critical/High count)
description: >
  Runs Trivy in fs (SCA) or image mode and reports whether the target is
  clean of Critical/High — the threshold every G1-G3 security criterion
  uses. Policy: a Critical/High with a released fix blocks; one with no
  upstream fix yet is reported in the detail but doesn't block (unless
  block-unfixed=true), since no change to this repo can remove it. Never
  fails the step itself; the calling gate decides.

inputs:
  mode:
    description: fs | image
    required: true
  target:
    description: Path (fs) or image reference (image)
    required: true
  report:
    description: JSON report output path
    required: true
  trivy-version:
    default: "0.74.0"
    required: false
  block-unfixed:
    description: Also block on Critical/High that have no fixed version yet
    default: "false"
    required: false
  skip-dirs:
    description: Comma-separated directories to skip (fs mode)
    default: ""
    required: false

outputs:
  status:
    value: ${{ steps.count.outputs.status }}
  detail:
    value: ${{ steps.count.outputs.detail }}
  count:
    value: ${{ steps.count.outputs.count }}

runs:
  using: composite
  steps:
    - id: scan
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        TARGET: ${{ inputs.target }}
        REPORT: ${{ inputs.report }}
        TRIVY_VERSION: ${{ inputs.trivy-version }}
        SKIP_DIRS: ${{ inputs.skip-dirs }}
      run: |
        set -uo pipefail
        case "$MODE" in
          fs) scanners="--scanners vuln${SKIP_DIRS:+ --skip-dirs $SKIP_DIRS}" ;;
          image) scanners="--scanners vuln" ;;
          *) echo "mode must be fs|image"; exit 1 ;;
        esac
        # Docker socket is mounted for image mode so private images pulled
        # by an earlier `docker login` in this job are reachable.
        # shellcheck disable=SC2086
        docker run --rm -v "$PWD:/work" -w /work -v /var/run/docker.sock:/var/run/docker.sock \
          -v "$HOME/.docker:/root/.docker:ro" \
          "aquasec/trivy:${TRIVY_VERSION}" "$MODE" $scanners --severity CRITICAL,HIGH \
          --format json --output "/work/${REPORT}" --exit-code 0 "$TARGET" || echo "scan_error=1" >> "$GITHUB_OUTPUT"
    - id: count
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        REPORT: ${{ inputs.report }}
        SCAN_ERROR: ${{ steps.scan.outputs.scan_error }}
        BLOCK_UNFIXED: ${{ inputs.block-unfixed }}
      run: |
        python3 - <<'PY'
        import json, os
        mode, report = os.environ["MODE"], os.environ["REPORT"]
        out = open(os.environ["GITHUB_OUTPUT"], "a")
        if os.environ.get("SCAN_ERROR") or not os.path.exists(report):
            # A scanner that didn't run is not a clean scan.
            out.write("status=fail\ndetail=Trivy scan did not complete\ncount=-1\n")
            raise SystemExit
        results = json.load(open(report)).get("Results") or []
        vulns = [v for r in results for v in (r.get("Vulnerabilities") or [])]
        fixable = [v for v in vulns if v.get("FixedVersion")]
        unfixed = [v for v in vulns if not v.get("FixedVersion")]
        blocking = vulns if os.environ.get("BLOCK_UNFIXED") == "true" else fixable
        by_sev = {}
        for v in blocking:
            by_sev[v.get("Severity")] = by_sev.get(v.get("Severity"), 0) + 1
        sev = ", ".join(f"{k} {n}" for k, n in sorted(by_sev.items())) or "none"
        top = ", ".join(sorted({f"{v['VulnerabilityID']} ({v['PkgName']})" for v in blocking})[:8])
        unfixed_note = "blocking" if os.environ.get("BLOCK_UNFIXED") == "true" else "not blocking"
        detail = f"{len(blocking)} blocking Critical/High ({sev}{'; ' + top if top else ''}); {len(unfixed)} without an upstream fix ({unfixed_note}) — trivy {mode}"
        out.write(f"status={'fail' if blocking else 'pass'}\n")
        out.write(f"detail={detail}\n")
        out.write(f"count={len(blocking)}\n")
        PY

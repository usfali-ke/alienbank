# G2 — Artifact: build once, and sign only an artifact whose build config
# is controlled and reproducible, whose dependencies (SCA), IaC and image
# are clean of Critical/High, and which has an SBOM. The signed digest is
# the only thing any later stage tests (G3) or deploys (G5) — nothing is
# ever rebuilt.
#
#   build ─┬─ image-scan ─┐
#          └─ sbom ───────┤
#   sca ──────────────────┼─ sign ─ G2 artifact gate ─ G3 (devsecops-uat.yml)
#   iac ──────────────────┘
#
# Each control job ends in .github/scripts/verdict.py (red job = failed
# control); the gate job records `gate-result-G2` for the dashboard. Deploy
# commits (deploy/**, written by devsecops-release.yml) don't rebuild.
#
# Signing happens in this file on purpose: the keyless signature's
# identity is this workflow at refs/heads/main, and that exact identity is
# what Kyverno admits and devsecops-release.yml verifies.

name: devsecops-build

on:
  push:
    branches: [main]
    paths-ignore: ["deploy/**", "**.md"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: devsecops-build-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/usfali-ke/alienbank

jobs:
  build:
    # The signing identity is tied to refs/heads/main; a dispatch from
    # another branch must not publish an image.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image: ${{ steps.push.outputs.image }}
      result: ${{ steps.verdict.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: repro
        name: Build twice, compare digests
        # Same commit, SOURCE_DATE_EPOCH = commit time, timestamps rewritten,
        # no BuildKit provenance/SBOM (those embed build time). The second
        # build ignores the cache. Both run on this one runner: this proves
        # the build is deterministic here, not that an independent rebuilder
        # gets the same bytes.
        run: |
          set -uo pipefail
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct); export SOURCE_DATE_EPOCH
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          common=(--provenance=false --sbom=false --build-arg SOURCE_DATE_EPOCH
                  --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
                  --label "org.opencontainers.image.revision=${GITHUB_SHA}")
          rc=0
          docker buildx build "${common[@]}" --output "type=oci,dest=b1.tar,rewrite-timestamp=true" --metadata-file b1.json . || rc=1
          docker buildx build "${common[@]}" --no-cache --output "type=oci,dest=b2.tar,rewrite-timestamp=true" --metadata-file b2.json . || rc=1
          { echo "rc=$rc"
            echo "d1=$(jq -r '."containerimage.digest" // empty' b1.json 2>/dev/null)"
            echo "d2=$(jq -r '."containerimage.digest" // empty' b2.json 2>/dev/null)"; } >> "$GITHUB_OUTPUT"
      - id: push
        name: Push ghcr.io/usfali-ke/alienbank:sha-<commit>
        if: steps.repro.outputs.rc == '0'
        # Same inputs from the warm cache; verdict compares its digest with
        # the two builds above.
        run: |
          set -euo pipefail
          docker buildx build --provenance=false --sbom=false --build-arg SOURCE_DATE_EPOCH \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --output "type=image,name=${IMAGE}:sha-${GITHUB_SHA},push=true,oci-mediatypes=true,rewrite-timestamp=true" \
            --metadata-file push.json .
          digest=$(jq -r '."containerimage.digest"' push.json)
          { echo "digest=$digest"; echo "image=${IMAGE}@${digest}"; } >> "$GITHUB_OUTPUT"
      - id: verdict
        if: always()
        env:
          RC: ${{ steps.repro.outputs.rc }}
          D1: ${{ steps.repro.outputs.d1 }}
          D2: ${{ steps.repro.outputs.d2 }}
          PUSHED: ${{ steps.push.outputs.digest }}
        run: python3 .github/scripts/verdict.py build Dockerfile

  sca:
    uses: ./.github/workflows/control-sca.yml
    permissions:
      contents: read

  iac:
    uses: ./.github/workflows/control-iac.yml
    permissions:
      contents: read

  # These scan the pushed image, so they run whenever one was pushed —
  # even if the build control itself failed (e.g. not reproducible) — to
  # report every finding in one run.
  image-scan:
    needs: build
    if: ${{ !cancelled() && needs.build.outputs.digest != '' }}
    uses: ./.github/workflows/control-image-scan.yml
    permissions:
      contents: read
      packages: read
    with:
      image: ${{ needs.build.outputs.image }}
      base-image: python:3.12-slim@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9

  sbom:
    needs: build
    if: ${{ !cancelled() && needs.build.outputs.digest != '' }}
    uses: ./.github/workflows/control-sbom.yml
    permissions:
      contents: read
      packages: read
    with:
      image: ${{ needs.build.outputs.image }}

  sign:
    needs: [build, sca, iac, image-scan, sbom]
    if: ${{ !cancelled() && needs.build.outputs.digest != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      result: ${{ steps.verdict.outputs.result }}
    env:
      REF: ${{ needs.build.outputs.image }}
      CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/devsecops-build.yml@refs/heads/main
      CERT_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - id: ready
        name: Every other G2 control passed?
        # A signature is the statement "this passed G2".
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          not_ready=$(jq -r 'to_entries | map(select(.value.result != "success") | .key) | join(", ")' <<<"$NEEDS")
          echo "not_ready=$not_ready" >> "$GITHUB_OUTPUT"
      - if: steps.ready.outputs.not_ready == ''
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          # cosign v2 writes the .sig/.att tags Kyverno verifies; v3 switches
          # to the bundle format.
          cosign-release: v2.6.5
      - if: steps.ready.outputs.not_ready == ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - if: steps.ready.outputs.not_ready == ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
      - if: steps.ready.outputs.not_ready == ''
        name: Sign, attest SBOM + SLSA v1 provenance
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPO_ID: ${{ github.repository_id }}
          OWNER_ID: ${{ github.repository_owner_id }}
          RUNNER_ENV: ${{ runner.environment }}
        run: |
          set -euo pipefail
          python3 .github/scripts/slsa_predicate.py > provenance.slsa1.json
          cosign sign --yes "$REF"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$REF"
          cosign attest --yes --type slsaprovenance1 --predicate provenance.slsa1.json "$REF"
      - if: steps.ready.outputs.not_ready == ''
        # GitHub's attestation store too, so `gh attestation verify` works.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.build.outputs.digest }}
          push-to-registry: true
      - id: verify
        if: always() && steps.ready.outputs.not_ready == ''
        # Pass means the signature and both attestations verify against the
        # identity admission checks — not merely that signing ran.
        run: |
          fail=""
          id=(--certificate-identity "$CERT_IDENTITY" --certificate-oidc-issuer "$CERT_ISSUER")
          cosign verify "${id[@]}" "$REF" >/dev/null || fail="$fail signature"
          cosign verify-attestation "${id[@]}" --type cyclonedx "$REF" >/dev/null || fail="$fail sbom-attestation"
          cosign verify-attestation "${id[@]}" --type slsaprovenance1 "$REF" >/dev/null || fail="$fail slsa-attestation"
          echo "failed=$fail" >> "$GITHUB_OUTPUT"
      - id: verdict
        if: always()
        env:
          NOT_READY: ${{ steps.ready.outputs.not_ready }}
          VERIFY_FAILED: ${{ steps.verify.outputs.failed }}
        run: python3 .github/scripts/verdict.py signed

  gate-g2:
    name: G2 artifact gate
    needs: [build, sca, iac, image-scan, sbom, sign]
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - uses: ./.github/actions/gate
        with:
          gate: G2
          needs: ${{ toJSON(needs) }}
          subject: ${{ needs.build.outputs.digest || github.sha }}
          artifact-digest: ${{ needs.build.outputs.digest }}

  g3:
    name: G3
    needs: [build, gate-g2]
    uses: ./.github/workflows/devsecops-uat.yml
    permissions:
      contents: read
      packages: read
    with:
      digest: ${{ needs.build.outputs.digest }}

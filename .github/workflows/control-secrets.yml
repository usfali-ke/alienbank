# Secret scan: no leak in the commits being merged — a secret in any of
# them is a leak even if a later commit deletes it.
name: control-secrets
on:
  workflow_call:
    inputs:
      base:
        type: string
        required: true
      head:
        type: string
        required: true
    outputs:
      result:
        description: verdict JSON {status, detail, metrics} (.github/scripts/verdict.py)
        value: ${{ jobs.control.outputs.result }}
jobs:
  control:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.verdict.outputs.result }}
    permissions:
      contents: read
    env:
      RANGE: ${{ inputs.base }}..${{ inputs.head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --log-opts="$RANGE" --report-format json --report-path /repo/gitleaks.json \
            --exit-code 0 --redact /repo || true
      - id: verdict
        if: always()
        run: python3 .github/scripts/verdict.py gitleaks gitleaks.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evidence-secrets
          path: gitleaks.json
          if-no-files-found: ignore

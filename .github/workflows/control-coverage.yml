# Coverage: line coverage of tests/unit at or above the ratchet.
name: control-coverage
on:
  workflow_call:
    inputs:
      threshold:
        type: string
        default: "40"
    outputs:
      result:
        description: verdict JSON {status, detail, metrics} (.github/scripts/verdict.py)
        value: ${{ jobs.control.outputs.result }}
jobs:
  control:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.verdict.outputs.result }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
      - run: |
          { uv sync --frozen --group dev && uv run --frozen pytest tests/unit --cov --cov-report=xml:coverage.xml; } || true
      - id: verdict
        if: always()
        env:
          COVERAGE_THRESHOLD: ${{ inputs.threshold }}
        run: python3 .github/scripts/verdict.py coverage coverage.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evidence-coverage
          path: coverage.xml
          if-no-files-found: ignore

# Compliance: no High/Critical misconfiguration (trivy config KSV rules,
# incl. Pod Security Standards) in the deploy/kind render.
name: control-compliance
on:
  workflow_call:
    outputs:
      result:
        description: verdict JSON {status, detail, metrics} (.github/scripts/verdict.py)
        value: ${{ jobs.control.outputs.result }}
jobs:
  control:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.verdict.outputs.result }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
      - run: |
          set -euo pipefail
          mkdir -p render
          kubectl kustomize deploy/kind | uv run --no-project --with pyyaml==6.0.3 python .github/scripts/scan_view.py > render/kind.yaml
          docker run --rm -v "$PWD/render:/work" aquasec/trivy:0.74.0 config \
            --severity HIGH,CRITICAL --format json --output /work/trivy-config.json --exit-code 0 /work || true
      - id: verdict
        if: always()
        run: python3 .github/scripts/verdict.py trivy-config render/trivy-config.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evidence-compliance
          path: render/
          if-no-files-found: ignore

# IaC: checkov clean on what actually ships — the Dockerfile and the
# GitOps render of deploy/kind (k8s/ is the legacy manual path no pipeline
# deploys). Rollouts are re-expressed as Deployments for scanning only
# (.github/scripts/scan_view.py), else the workload would be skipped.
name: control-iac
on:
  workflow_call:
    outputs:
      result:
        description: verdict JSON {status, detail, metrics} (.github/scripts/verdict.py)
        value: ${{ jobs.control.outputs.result }}
jobs:
  control:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.verdict.outputs.result }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
      - run: |
          set -euo pipefail
          mkdir -p iac
          cp Dockerfile iac/Dockerfile
          kubectl kustomize deploy/kind | uv run --no-project --with pyyaml==6.0.3 python .github/scripts/scan_view.py > iac/kind.yaml
          docker run --rm -v "$PWD/iac:/iac" bridgecrew/checkov:3.3.19 \
            -f /iac/kind.yaml -f /iac/Dockerfile --framework kubernetes dockerfile \
            -o json --output-file-path /iac --soft-fail --quiet >/dev/null || true
      - id: verdict
        if: always()
        run: python3 .github/scripts/verdict.py checkov iac/results_json.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evidence-iac
          path: iac/
          if-no-files-found: ignore

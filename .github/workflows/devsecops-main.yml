# G2 — Artifact creation: build only if build config is controlled and
# reproducible, SCA/IaC/image scans are clean of Critical/High, and an SBOM
# exists; sign + attest the image only when all of that holds.
# G3 — Pre-production: runs only on a G2 pass, against the exact image
# digest G2 produced.
#
# Each gate records its decision as the artifact gate-result-G2 /
# gate-result-G3, which the security dashboard pulls (see
# .github/actions/report-gate). Deploy commits (deploy/**, written by
# devsecops-release.yml) don't rebuild.

name: devsecops-main

on:
  push:
    branches: [main]
    paths-ignore: ["deploy/**", "**.md"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: devsecops-main-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/usfali-ke/alienbank
  # The base image pinned in the Dockerfile; named in the image-scan detail.
  BASE_IMAGE: python:3.12-slim@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9
  TRIVY_VERSION: "0.74.0"

jobs:
  # ---------------------------------------------------------------- G2 ---
  build:
    # Signing identity (and so admission in kind) is tied to refs/heads/main;
    # a dispatch from another branch must not publish an image.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      status: ${{ steps.verdict.outputs.status }}
      detail: ${{ steps.verdict.outputs.detail }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: pins
        name: Base images digest-pinned
        # A tag can be re-pointed upstream; only a digest makes the build
        # input fixed. Covers the BuildKit syntax image and every FROM.
        run: |
          python3 - <<'PY'
          import os, re
          refs, bad = [], []
          for line in open("Dockerfile"):
              m = re.match(r"\s*#\s*syntax=(\S+)", line) or re.match(r"\s*FROM\s+(?:--\S+\s+)*(\S+)", line, re.I)
              if m:
                  ref = m.group(1)
                  refs.append(ref)
                  if not re.search(r"@sha256:[0-9a-f]{64}$", ref):
                      bad.append(ref)
          ok = refs and not bad
          detail = f"{len(refs) - len(bad)}/{len(refs)} base refs digest-pinned" + (f" (unpinned: {', '.join(bad)})" if bad else "")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"status={'pass' if ok else 'fail'}\ndetail={detail}\n")
          print(detail)
          PY
      - id: repro
        name: Build twice, compare digests
        # Same commit, SOURCE_DATE_EPOCH = commit time, timestamps rewritten,
        # and no provenance/SBOM attached by BuildKit (those embed build
        # time). The second build ignores the cache, so every layer is
        # re-executed. Both builds run on this one runner — this proves the
        # build is deterministic here, not that an independent rebuilder on
        # other hardware gets the same bytes.
        run: |
          set -uo pipefail
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          common=(--provenance=false --sbom=false --build-arg SOURCE_DATE_EPOCH
                  --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
                  --label "org.opencontainers.image.revision=${GITHUB_SHA}")
          rc=0
          docker buildx build "${common[@]}" --output "type=oci,dest=b1.tar,rewrite-timestamp=true" --metadata-file b1.json . || rc=1
          docker buildx build "${common[@]}" --no-cache --output "type=oci,dest=b2.tar,rewrite-timestamp=true" --metadata-file b2.json . || rc=1
          d1=$(jq -r '."containerimage.digest" // empty' b1.json 2>/dev/null)
          d2=$(jq -r '."containerimage.digest" // empty' b2.json 2>/dev/null)
          { echo "rc=$rc"; echo "d1=$d1"; echo "d2=$d2"; } >> "$GITHUB_OUTPUT"
          echo "build 1: ${d1:-none}"; echo "build 2: ${d2:-none}"
      - id: push
        name: Push ghcr.io/usfali-ke/alienbank:sha-<commit>
        if: steps.repro.outputs.rc == '0'
        # Rebuilt from the warm cache with the same inputs; the digest is
        # compared against the two reproducibility builds below.
        run: |
          set -euo pipefail
          docker buildx build --provenance=false --sbom=false --build-arg SOURCE_DATE_EPOCH \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --output "type=image,name=${IMAGE}:sha-${GITHUB_SHA},push=true,oci-mediatypes=true,rewrite-timestamp=true" \
            --metadata-file push.json .
          echo "digest=$(jq -r '."containerimage.digest"' push.json)" >> "$GITHUB_OUTPUT"
      - id: verdict
        if: always()
        env:
          PIN_STATUS: ${{ steps.pins.outputs.status }}
          PIN_DETAIL: ${{ steps.pins.outputs.detail }}
          RC: ${{ steps.repro.outputs.rc }}
          D1: ${{ steps.repro.outputs.d1 }}
          D2: ${{ steps.repro.outputs.d2 }}
          PUSHED: ${{ steps.push.outputs.digest }}
        run: |
          python3 - <<'PY'
          import os
          e = os.environ.get
          short = lambda d: (d or "none")[:19]
          if e("RC") != "0" or not e("D1") or not e("D2"):
              ok, repro = False, "build failed"
          elif e("D1") != e("D2"):
              ok, repro = False, f"NOT reproducible: {short(e('D1'))} vs {short(e('D2'))} (cached vs --no-cache)"
          elif e("PUSHED") != e("D1"):
              ok, repro = False, f"reproducible ({short(e('D1'))}) but pushed digest differs ({short(e('PUSHED'))})"
          else:
              ok, repro = True, f"2 builds (cached + --no-cache, same runner) and the pushed image all {short(e('D1'))}"
          ok = ok and e("PIN_STATUS") == "pass"
          detail = f"{repro}; {e('PIN_DETAIL') or 'pin check did not run'}; Dockerfile + uv.lock at {os.environ['GITHUB_SHA'][:7]}"
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"status={'pass' if ok else 'fail'}\ndetail={detail}\n")
          print(detail)
          PY

  sca:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      status: ${{ steps.trivy.outputs.status }}
      detail: ${{ steps.trivy.outputs.detail }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: trivy
        uses: ./.github/actions/trivy-scan
        with:
          mode: fs
          # Finds uv.lock — the full resolved dependency set the image
          # installs (uv sync --frozen).
          target: .
          report: trivy-sca.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: scan-trivy-sca
          path: trivy-sca.json
          if-no-files-found: ignore

  iac:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      status: ${{ steps.checkov.outputs.status }}
      detail: ${{ steps.checkov.outputs.detail }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
      - id: render
        # What ships is the Dockerfile and the GitOps render of deploy/kind.
        # k8s/ is the legacy manual path (plus lab SIEM manifests) that no
        # pipeline deploys, so it's out of scope here.
        run: |
          mkdir -p iac
          rc=0
          kubectl kustomize deploy/kind > iac/kind.raw.yaml || rc=$?
          [ "$rc" = 0 ] && { uv run --no-project --with pyyaml==6.0.3 python .github/scripts/scan_view.py < iac/kind.raw.yaml > iac/kind.yaml || rc=$?; }
          cp Dockerfile iac/Dockerfile
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - id: checkov
        env:
          RENDER_RC: ${{ steps.render.outputs.rc }}
        # Open-source checkov has no severities (those need a Prisma API
        # key), so every failed check blocks; exceptions must be inline
        # `checkov.io/skipN` annotations with a reason, which stay reviewable
        # in git and are counted in the detail.
        run: |
          if [ "$RENDER_RC" != 0 ]; then
            printf 'status=fail\ndetail=kustomize build deploy/kind failed\n' >> "$GITHUB_OUTPUT"; exit 0
          fi
          docker run --rm -v "$PWD/iac:/iac" bridgecrew/checkov:3.3.19 \
            -f /iac/kind.yaml -f /iac/Dockerfile --framework kubernetes dockerfile \
            -o json --output-file-path /iac --soft-fail --quiet >/dev/null || true
          python3 - <<'PY'
          import json, os
          out = open(os.environ["GITHUB_OUTPUT"], "a")
          try:
              reports = json.load(open("iac/results_json.json"))
          except (OSError, ValueError):
              out.write("status=fail\ndetail=checkov did not complete\n")
              raise SystemExit
          reports = reports if isinstance(reports, list) else [reports]
          passed = sum(r["summary"]["passed"] for r in reports)
          failed = [c for r in reports for c in r["results"].get("failed_checks", [])]
          skipped = [c for r in reports for c in r["results"].get("skipped_checks", [])]
          ids = ", ".join(sorted({f"{c['check_id']} ({c['resource']})" for c in failed})[:8])
          skip_ids = ", ".join(sorted({c["check_id"] for c in skipped}))
          detail = (f"{len(failed)} failed, {passed} passed, {len(skipped)} skipped with inline justification"
                    f"{' (' + skip_ids + ')' if skip_ids else ''} — checkov on Dockerfile + kustomize build deploy/kind"
                    f"{': ' + ids if ids else ''}")
          out.write(f"status={'fail' if failed or passed == 0 else 'pass'}\ndetail={detail}\n")
          print(detail)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: scan-checkov
          path: iac/
          if-no-files-found: ignore

  image-scan:
    needs: build
    if: needs.build.outputs.digest != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      status: ${{ steps.verdict.outputs.status }}
      detail: ${{ steps.verdict.outputs.detail }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: trivy
        uses: ./.github/actions/trivy-scan
        with:
          mode: image
          target: ${{ env.IMAGE }}@${{ needs.build.outputs.digest }}
          report: trivy-image.json
      - id: verdict
        env:
          SCAN_STATUS: ${{ steps.trivy.outputs.status }}
          SCAN_DETAIL: ${{ steps.trivy.outputs.detail }}
        # "Hardened base" beyond the CVE count: the base is digest-pinned
        # (G2 pin check) and the image doesn't run as root.
        run: |
          python3 - <<'PY'
          import json, os
          try:
              user = (json.load(open("trivy-image.json")).get("Metadata", {}).get("ImageConfig", {}).get("config", {}).get("User") or "").strip()
          except (OSError, ValueError):
              user = None
          root = user is None or user.split(":")[0] in ("", "0", "root")
          ok = os.environ.get("SCAN_STATUS") == "pass" and not root
          detail = (f"base {os.environ['BASE_IMAGE'][:37]}…; runs as {user or 'root (no USER)'}; "
                    f"{os.environ.get('SCAN_DETAIL') or 'scan did not complete'}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"status={'pass' if ok else 'fail'}\ndetail={detail}\n")
          print(detail)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: scan-trivy-image
          path: trivy-image.json
          if-no-files-found: ignore

  sbom:
    needs: build
    if: needs.build.outputs.digest != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      status: ${{ steps.check.outputs.status }}
      detail: ${{ steps.check.outputs.detail }}
    steps:
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        continue-on-error: true
        with:
          image: ${{ env.IMAGE }}@${{ needs.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}
          syft-version: v1.52.0
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - id: check
        # Present means a parseable CycloneDX document that actually lists
        # components — an empty SBOM is not an SBOM.
        run: |
          python3 - <<'PY'
          import json, os
          try:
              bom = json.load(open("sbom.cdx.json"))
              n = len(bom.get("components") or [])
              ok = bom.get("bomFormat") == "CycloneDX" and n > 0
              detail = f"CycloneDX {bom.get('specVersion')} with {n} components (syft v1.52.0)"
          except (OSError, ValueError):
              ok, detail = False, "no SBOM produced"
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"status={'pass' if ok else 'fail'}\ndetail={detail}\n")
          print(detail)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: ignore

  sign:
    needs: [build, sca, iac, image-scan, sbom]
    if: always() && needs.build.outputs.digest != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      status: ${{ steps.verify.outputs.status || steps.decide.outputs.status }}
      detail: ${{ steps.verify.outputs.detail || steps.decide.outputs.detail }}
    env:
      REF: ${{ needs.build.outputs.digest }}
      # Kyverno's verifyImages rule in kind checks exactly this identity.
      CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/devsecops-main.yml@refs/heads/main
      CERT_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - id: decide
        env:
          NEEDS: ${{ toJSON(needs) }}
        # Only an artifact that passed every other G2 criterion is signed —
        # a signature is the statement "this passed G2".
        run: |
          python3 - <<'PY'
          import json, os
          needs = json.loads(os.environ["NEEDS"])
          failing = [j for j in ("build", "sca", "iac", "image-scan", "sbom")
                     if (needs.get(j, {}).get("outputs") or {}).get("status") != "pass"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              if failing:
                  out.write(f"sign=false\nstatus=fail\ndetail=not signed: G2 criteria failed ({', '.join(failing)})\n")
              else:
                  out.write("sign=true\n")
          PY
      - if: steps.decide.outputs.sign == 'true'
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          # cosign v2 writes the legacy .sig/.att tags Kyverno verifies;
          # cosign v3 (installer v4's default) switches to the bundle format.
          cosign-release: v2.6.5
      - if: steps.decide.outputs.sign == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - if: steps.decide.outputs.sign == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
      - id: provenance
        if: steps.decide.outputs.sign == 'true'
        # SLSA v1 predicate for `cosign attest --type slsaprovenance1`,
        # built from the GitHub context the same way GitHub's own generator
        # shapes it.
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPO_ID: ${{ github.repository_id }}
          OWNER_ID: ${{ github.repository_owner_id }}
          RUNNER_ENV: ${{ runner.environment }}
        run: |
          python3 - <<'PY'
          import json, os
          e = os.environ
          repo_url = f"{e['GITHUB_SERVER_URL']}/{e['GITHUB_REPOSITORY']}"
          path = e["GITHUB_WORKFLOW_REF"].split("@", 1)[0].split("/", 2)[2]
          run_url = f"{repo_url}/actions/runs/{e['GITHUB_RUN_ID']}"
          predicate = {
              "buildDefinition": {
                  "buildType": "https://actions.github.io/buildtypes/workflow/v1",
                  "externalParameters": {"workflow": {"ref": e["GITHUB_REF"], "repository": repo_url, "path": path}},
                  "internalParameters": {"github": {
                      "event_name": e["EVENT_NAME"], "repository_id": e["REPO_ID"],
                      "repository_owner_id": e["OWNER_ID"], "runner_environment": e["RUNNER_ENV"],
                  }},
                  "resolvedDependencies": [{
                      "uri": f"git+{repo_url}@{e['GITHUB_REF']}",
                      "digest": {"gitCommit": e["GITHUB_SHA"]},
                  }],
              },
              "runDetails": {
                  "builder": {"id": f"https://github.com/actions/runner/{e['RUNNER_ENV']}"},
                  "metadata": {"invocationId": run_url},
              },
          }
          json.dump(predicate, open("provenance.slsa1.json", "w"), indent=2)
          PY
      - id: attest
        if: steps.decide.outputs.sign == 'true'
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${REF}"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "${IMAGE}@${REF}"
          cosign attest --yes --type slsaprovenance1 --predicate provenance.slsa1.json "${IMAGE}@${REF}"
      - if: steps.decide.outputs.sign == 'true'
        # GitHub's attestation store too, so `gh attestation verify` works.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.build.outputs.digest }}
          push-to-registry: true
      - id: verify
        if: always() && steps.decide.outputs.sign == 'true'
        # Pass means the signature and both attestations verify against the
        # identity admission will check — not merely that signing ran.
        run: |
          fail=""
          id=(--certificate-identity "$CERT_IDENTITY" --certificate-oidc-issuer "$CERT_ISSUER")
          cosign verify "${id[@]}" "${IMAGE}@${REF}" >/dev/null || fail="$fail signature"
          cosign verify-attestation "${id[@]}" --type cyclonedx "${IMAGE}@${REF}" >/dev/null || fail="$fail sbom-attestation"
          cosign verify-attestation "${id[@]}" --type slsaprovenance1 "${IMAGE}@${REF}" >/dev/null || fail="$fail slsa-attestation"
          if [ -z "$fail" ]; then
            echo "status=pass" >> "$GITHUB_OUTPUT"
            echo "detail=cosign keyless signature + cyclonedx and slsaprovenance1 attestations verified for devsecops-main.yml@refs/heads/main (public Rekor); GitHub build provenance attested" >> "$GITHUB_OUTPUT"
          else
            echo "status=fail" >> "$GITHUB_OUTPUT"
            echo "detail=signing ran but verification failed:${fail}" >> "$GITHUB_OUTPUT"
          fi

  gate-g2:
    name: G2 artifact gate
    needs: [build, sca, iac, image-scan, sbom, sign]
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      status: ${{ steps.assemble.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - id: assemble
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          needs = json.loads(os.environ["NEEDS"])

          def out(job, key):
              return (needs.get(job, {}).get("outputs") or {}).get(key) or ""

          def crit(key, job, category):
              status, detail = out(job, "status"), out(job, "detail")
              if status not in ("pass", "fail"):
                  status, detail = "fail", f"check did not complete (job result: {needs.get(job, {}).get('result')})"
              return {"key": key, "status": status, "category": category, "detail": detail}

          criteria = [
              crit("reproducible_build_config_controlled", "build", "delivery"),
              crit("sca_clean", "sca", "security"),
              crit("iac_clean", "iac", "security"),
              crit("container_image_scan_hardened_base", "image-scan", "security"),
              crit("artifact_signed_attested", "sign", "security"),
              crit("sbom_present", "sbom", "security"),
          ]
          status = "pass" if all(c["status"] == "pass" for c in criteria) else "fail"
          for c in criteria:
              print(f"{c['status']:>4}  {c['key']}: {c['detail']}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"status={status}\ncriteria={json.dumps(criteria)}\n")
          PY
      - uses: ./.github/actions/report-gate
        with:
          gate: G2
          status: ${{ steps.assemble.outputs.status }}
          subject: ${{ needs.build.outputs.digest || github.sha }}
          criteria-json: ${{ steps.assemble.outputs.criteria }}
          artifact-digest: ${{ needs.build.outputs.digest }}
      - name: Enforce
        if: steps.assemble.outputs.status != 'pass'
        run: |
          echo "::error::G2 artifact gate failed — the image is not signed and can't be released"
          exit 1

  # ---------------------------------------------------------------- G3 ---
  g3:
    name: G3 pre-production gate
    needs: [build, gate-g2]
    if: needs.gate-g2.outputs.status == 'pass'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      REF: ${{ needs.build.outputs.digest }}
      TARGET_URL: http://127.0.0.1:8080
      SLO_P95_MS: "500"
      COVERAGE_THRESHOLD: "40"
    steps:
      - id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: unit
        name: Unit/regression suite with coverage
        run: |
          rc=0
          uv sync --frozen --group dev || rc=$?
          [ "$rc" = 0 ] && { uv run --frozen pytest tests/unit --cov --cov-report=xml:coverage.xml --junitxml=junit-unit.xml || rc=$?; }
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - id: app
        name: Start the G2 image
        # Exactly the digest G2 signed, read-only root, no LLM/embedder
        # reachable (the app logs and continues without its RAG index).
        run: |
          set -uo pipefail
          ALIENBANK_SECRET_KEY=$(openssl rand -hex 32); export ALIENBANK_SECRET_KEY
          echo "::add-mask::$ALIENBANK_SECRET_KEY"
          docker run -d --name alienbank -p 127.0.0.1:8080:8080 --read-only \
            --tmpfs /tmp --tmpfs /app/data:uid=10001,gid=10001,mode=0700 --tmpfs /app/.cache:uid=10001,gid=10001 \
            -e ALIENBANK_SECRET_KEY -e ALIENBANK_LLM_PROVIDER=ollama \
            -e OLLAMA_BASE_URL=http://127.0.0.1:9/v1 -e ALIENBANK_EMBED_BASE_URL=http://127.0.0.1:9/v1 \
            -e ALIENBANK_GUARD_BASE_URL=http://127.0.0.1:9/v1 \
            "${IMAGE}@${REF}" || { echo "up=false" >> "$GITHUB_OUTPUT"; exit 0; }
          for _ in $(seq 60); do
            if curl -fsS -o /dev/null "$TARGET_URL/login"; then echo "up=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 3
          done
          docker logs alienbank | tail -50
          echo "up=false" >> "$GITHUB_OUTPUT"
      - id: integration
        if: steps.app.outputs.up == 'true'
        run: |
          rc=0
          uv run --frozen pytest tests/integration --junitxml=junit-integration.xml || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - id: tests
        if: always()
        uses: ./.github/actions/test-summary
        with:
          junit-glob: "junit-*.xml"
          coverage-file: coverage.xml
      - id: perf
        if: steps.app.outputs.up == 'true'
        run: |
          mkdir -p k6out
          docker run --rm --network host --user "$(id -u):$(id -g)" \
            -v "$PWD/tests/perf:/perf:ro" -v "$PWD/k6out:/out" \
            -e TARGET_URL -e SUMMARY_OUT=/out/k6-summary.json \
            grafana/k6:2.3.0 run /perf/login.js || true
      - id: dast
        if: steps.app.outputs.up == 'true'
        # Passive baseline of the unauthenticated surface (login page,
        # redirects, headers, static assets). -I: warnings don't change the
        # exit code; the gate reads the JSON report instead.
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:2.17.0 \
            zap-baseline.py -t "$TARGET_URL" -J zap.json -I -m 2 || true
      - id: compliance
        name: Compliance scan of the deploy/kind render
        run: |
          mkdir -p render
          if kubectl kustomize deploy/kind | uv run --no-project --with pyyaml==6.0.3 python .github/scripts/scan_view.py > render/kind.yaml; then
            docker run --rm -v "$PWD/render:/work" "aquasec/trivy:${TRIVY_VERSION}" config \
              --severity HIGH,CRITICAL --format json --output /work/trivy-config.json --exit-code 0 /work || true
          fi
      - name: Stop app
        if: always()
        run: |
          docker logs alienbank > app.log 2>&1 || true
          docker rm -f alienbank || true
      - id: assemble
        if: always()
        env:
          UNIT_RC: ${{ steps.unit.outputs.rc }}
          APP_UP: ${{ steps.app.outputs.up }}
          INTEGRATION_RC: ${{ steps.integration.outputs.rc }}
          PASSED: ${{ steps.tests.outputs.tests-passed }}
          TOTAL: ${{ steps.tests.outputs.tests-total }}
          COVERAGE: ${{ steps.tests.outputs.coverage-pct }}
        run: |
          python3 - <<'PY'
          import json, os
          e = os.environ.get

          def load(path):
              try:
                  return json.load(open(path))
              except (OSError, ValueError):
                  return None

          up = e("APP_UP") == "true"
          criteria = []

          passed, total = int(e("PASSED") or 0), int(e("TOTAL") or 0)
          ok = up and e("UNIT_RC") == "0" and e("INTEGRATION_RC") == "0" and total > 0 and passed == total
          criteria.append({"key": "functional_integration_regression_pass", "category": "quality",
                           "status": "pass" if ok else "fail",
                           "detail": f"{passed}/{total} passed (tests/unit regression + tests/integration against the G2 image)"
                                     + ("" if up else "; image did not start — integration not run"),
                           "metrics": {"tests_passed": passed, "tests_total": total}})

          slo = float(e("SLO_P95_MS"))
          k6 = load("k6out/k6-summary.json") or {}
          m = k6.get("metrics", {})
          p95 = (m.get("http_req_duration", {}).get("values") or {}).get("p(95)")
          failed_rate = (m.get("http_req_failed", {}).get("values") or {}).get("rate")
          checks_rate = (m.get("checks", {}).get("values") or {}).get("rate")
          if p95 is None:
              c = {"status": "fail", "detail": "k6 did not produce a summary"}
          else:
              ok = p95 <= slo and (failed_rate or 0) < 0.01 and (checks_rate or 0) >= 0.99
              c = {"status": "pass" if ok else "fail",
                   "detail": f"p95 {p95:.0f} ms vs SLO {slo:.0f} ms; {100 * (failed_rate or 0):.1f}% failed requests, "
                             f"{100 * (checks_rate or 0):.1f}% checks ok (k6, 10 VUs x 30s: /login + /api/accounts)",
                   "metrics": {"p95_ms": round(p95, 1), "slo_ms": slo}}
          criteria.append({"key": "performance_within_slo", "category": "quality", **c})

          threshold = float(e("COVERAGE_THRESHOLD"))
          cov = float(e("COVERAGE")) if e("COVERAGE") else None
          criteria.append({"key": "coverage_threshold_met", "category": "quality",
                           "status": "pass" if cov is not None and cov >= threshold else "fail",
                           # A ratchet at the current baseline, not a quality
                           # claim — raise it as tests are added (target 80).
                           "detail": (f"{cov:.1f}% line coverage vs ratchet {threshold:.0f}% (pytest-cov, tests/unit)"
                                      if cov is not None else "no coverage report"),
                           "metrics": {"coverage_pct": cov or 0.0, "threshold_pct": threshold}})

          zap = load("zap/zap.json")
          if zap is None:
              c = {"status": "fail", "detail": "ZAP baseline did not complete"}
          else:
              alerts = [a for s in zap.get("site", []) for a in s.get("alerts", [])]
              high = [a for a in alerts if str(a.get("riskcode")) == "3"]
              medium = [a for a in alerts if str(a.get("riskcode")) == "2"]
              names = ", ".join(sorted({a.get("name", "?") for a in high})[:6])
              c = {"status": "fail" if high else "pass",
                   "detail": f"{len(high)} High, {len(medium)} Medium alert types — ZAP 2.17.0 passive baseline, unauthenticated"
                             + (f": {names}" if names else "")}
          criteria.append({"key": "dast_scan_clean", "category": "security", **c})

          tc = load("render/trivy-config.json")
          if tc is None:
              c = {"status": "fail", "detail": "trivy config did not complete"}
          else:
              mis = [x for r in tc.get("Results") or [] for x in r.get("Misconfigurations") or [] if x.get("Status") == "FAIL"]
              ids = ", ".join(sorted({x.get("ID", "?") for x in mis})[:8])
              c = {"status": "fail" if mis else "pass",
                   "detail": f"{len(mis)} High/Critical misconfigurations — trivy config (KSV rules incl. Pod Security Standards) "
                             f"on kustomize build deploy/kind" + (f": {ids}" if ids else "")}
          criteria.append({"key": "compliance_scan_clean", "category": "security", **c})

          status = "pass" if all(c["status"] == "pass" for c in criteria) else "fail"
          for c in criteria:
              print(f"{c['status']:>4}  {c['key']}: {c['detail']}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"status={status}\ncriteria={json.dumps(criteria)}\n")
          PY
      - uses: ./.github/actions/report-gate
        if: always() && steps.assemble.outputs.status != ''
        with:
          gate: G3
          status: ${{ steps.assemble.outputs.status }}
          subject: ${{ needs.build.outputs.digest }}
          criteria-json: ${{ steps.assemble.outputs.criteria }}
          artifact-digest: ${{ needs.build.outputs.digest }}
          environment: ci
          started-at: ${{ steps.start.outputs.at }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: g3-evidence
          path: |
            junit-*.xml
            coverage.xml
            k6out/
            zap/zap.json
            render/
            app.log
          if-no-files-found: ignore
      - name: Enforce
        if: always() && steps.assemble.outputs.status != 'pass'
        run: |
          echo "::error::G3 pre-production gate failed — this digest must not be released"
          exit 1

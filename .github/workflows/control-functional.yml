# Functional/integration/regression: the unit suite (regression) plus
# tests/integration against the running G2 image all pass.
name: control-functional
on:
  workflow_call:
    inputs:
      image:
        description: image@sha256:… under test (the G2 digest)
        type: string
        required: true
    outputs:
      result:
        description: verdict JSON {status, detail, metrics} (.github/scripts/verdict.py)
        value: ${{ jobs.control.outputs.result }}
jobs:
  control:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.verdict.outputs.result }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: app
        uses: ./.github/actions/start-app
        with:
          image: ${{ inputs.image }}
      - id: run
        env:
          TARGET_URL: ${{ steps.app.outputs.url }}
        run: |
          rc=0
          uv sync --frozen --group dev || rc=$?
          uv run --frozen pytest tests/unit --junitxml=junit-unit.xml || rc=$?
          uv run --frozen pytest tests/integration --junitxml=junit-integration.xml || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - id: verdict
        if: always()
        env:
          RC: ${{ steps.run.outputs.rc }}
          LABEL: tests/unit regression + tests/integration against the G2 image
        run: python3 .github/scripts/verdict.py tests 'junit-*.xml'
      - if: always()
        run: docker logs alienbank > app.log 2>&1 || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evidence-functional
          path: |
            junit-*.xml
            app.log
          if-no-files-found: ignore

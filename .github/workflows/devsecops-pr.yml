# G1 — Merge: required reviewers approved AND unit tests pass AND SAST and
# secret scan clean of Critical/High AND commits signed AND the AI security
# review (Hermes) reports no Critical/High.
#
# Shape (same for every gate): one job per control, all in parallel; each
# ends with .github/scripts/verdict.py, which decides pass/fail and fails
# the job, so a red job is a failed control. The last job, "G1 merge
# gate", combines them (.github/scripts/gate.py), uploads `gate-result-G1`
# for the security dashboard, and fails unless all passed. The branch
# ruleset on main requires "G1 merge gate", which is what makes "merge
# only if" true.
#
# The dashboard ignores this run's evidence when the PR itself changes
# .github/ (a PR could otherwise rewrite this file to report a pass).
# Approvals by the PR author never count.

name: devsecops-pr

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions: {}

concurrency:
  group: devsecops-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  reviewers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      result: ${{ steps.verdict.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" --jq '.[] | tojson' > reviews.jsonl
      - id: verdict
        if: always()
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REQUIRED_APPROVALS: "1"
        run: python3 .github/scripts/verdict.py reviewers reviews.jsonl

  commits-signed:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      result: ${{ steps.verdict.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      # GitHub's own verification verdict (signature by a key registered to
      # the committer) — not just "has a signature".
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits" \
            --jq '.[] | [.sha[0:7], (.commit.verification.verified|tostring), .commit.verification.reason] | @tsv' > commits.tsv
      - id: verdict
        if: always()
        run: python3 .github/scripts/verdict.py commits commits.tsv

  unit-tests:
    uses: ./.github/workflows/control-unit-tests.yml
    permissions:
      contents: read

  sast:
    uses: ./.github/workflows/control-sast.yml
    permissions:
      contents: read

  secrets:
    uses: ./.github/workflows/control-secrets.yml
    permissions:
      contents: read
    with:
      base: ${{ github.event.pull_request.base.sha }}
      head: ${{ github.event.pull_request.head.sha }}

  ai-review:
    uses: ./.github/workflows/control-ai-review.yml
    permissions:
      contents: read
      pull-requests: read
      issues: read
    secrets:
      HERMES_WEBHOOK_SECRET: ${{ secrets.HERMES_WEBHOOK_SECRET }}

  gate:
    name: G1 merge gate
    needs: [reviewers, commits-signed, unit-tests, sast, secrets, ai-review]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - uses: ./.github/actions/gate
        with:
          gate: G1
          needs: ${{ toJSON(needs) }}
          # The merge gate runs on the pull request, where nothing is being
          # promoted: record=false makes the action upload `gate-preview-G1`
          # instead of `gate-result-G1`, the name the dashboard collects as
          # CURRENT gate evidence. A PR run's pre-merge state (the author's
          # unsigned commits, no reviewer yet, subject `pr-<number>`) must
          # not enter the promotion evidence the Secure Gates metric is
          # computed from — only a run on main records.
          record: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
          subject: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.sha }}
          commit-sha: ${{ github.event.pull_request.head.sha || github.sha }}

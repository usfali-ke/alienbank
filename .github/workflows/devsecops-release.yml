# G4 — Release approval, then G5 — Deployment, for the digest G2 built
# from this commit. Run from main: Actions → devsecops-release → Run
# workflow, with the change-request issue number.
#
#   G4 release approval ─┬─ provenance ─┐
#   (environment          └─ config ────┴─ deploy ─ G5 deployment gate
#    release-approval)
#
# G4 needs two independent approvals:
#   1. the protected environment `release-approval` — GitHub holds the job
#      until a required reviewer approves the run;
#   2. the security dashboard's decision on the change record (approved,
#      readiness, client approval, window, no open High/Critical, G2/G3 of
#      this digest). This run leaves a `release-request` artifact; the
#      dashboard answers with commit status `security-dashboard/G4`
#      pointing at this run.
# G5 deploys only by committing the digest to deploy/kind; Argo CD syncs
# it and runs the canary analysis. Nothing here talks to the cluster.

name: devsecops-release

on:
  workflow_dispatch:
    inputs:
      change:
        description: Change request issue number (the CHG-<n> being released)
        required: true
        type: number
      allow-self-approval:
        description: 'SEGREGATION-OF-DUTIES EXCEPTION (single-operator mode): approve with the starter/author account. Opt-in per run; honoured only for a repository admin, and recorded in the verdict detail.'
        required: false
        type: boolean
        default: false
      kind:
        description: Deployment kind
        required: true
        type: choice
        options: [planned, hotfix, fix_forward]
        default: planned

permissions: {}

concurrency:
  group: devsecops-release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/usfali-ke/alienbank
  CHANGE_ID: CHG-${{ inputs.change }}
  CERT_IDENTITY_REGEXP: ^https://github\.com/usfali-ke/alienbank/\.github/workflows/devsecops-build\.yml@refs/heads/main$
  CERT_ISSUER: https://token.actions.githubusercontent.com

jobs:
  g4:
    name: G4 release approval
    if: github.ref == 'refs/heads/main'
    environment: release-approval
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      statuses: read
      # approvals.sh reads this run's actor/re-runner and its environment
      # approvals, plus the change's pull requests and their commits, to
      # decide who may approve — and the repo admins for the admin-gated
      # self-approval waiver.
      actions: read
      pull-requests: read
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
      started-at: ${{ steps.digest.outputs.at }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: digest
        name: Resolve the G2 image for this commit
        run: |
          set -euo pipefail
          if ! digest=$(docker buildx imagetools inspect "${IMAGE}:sha-${GITHUB_SHA}" --format '{{.Manifest.Digest}}' 2>/dev/null) || [ -z "$digest" ]; then
            echo "::error::No image ${IMAGE}:sha-${GITHUB_SHA} — devsecops-build (G2) hasn't built this commit, or failed before pushing"
            exit 1
          fi
          { echo "digest=$digest"; echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"; } >> "$GITHUB_OUTPUT"
          echo "Releasing ${IMAGE}@${digest} (${CHANGE_ID})"
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.6.5
      - name: Signed by G2
        # G2 signs only digests that passed it — an unsigned digest failed
        # G2, so don't even ask for approval.
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          cosign verify --certificate-identity-regexp "$CERT_IDENTITY_REGEXP" \
            --certificate-oidc-issuer "$CERT_ISSUER" "${IMAGE}@${DIGEST}" >/dev/null \
            || { echo "::error::${IMAGE}@${DIGEST} has no valid G2 signature"; exit 1; }
      - id: change
        name: Change request
        # The release takes `change:` as a required input (CHG-<n>) — there
        # is no picker. change.sh resolves that id and fails with its own
        # actionable diagnostics when the issue doesn't exist or is a pull
        # request.
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGE: ${{ inputs.change }}
          SOURCE_SHA: ${{ github.sha }}
          REQUIRE: "true"
        run: bash .github/scripts/change.sh
      - name: Change request is open and names this release
        # CAB: before the approval is asked for, the change request must
        # still be OPEN and must name this release — this commit (full sha
        # or a ≥7-char prefix) or this run's URL. That is what ties the
        # release to the change it is authorised by.
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ steps.change.outputs.id }}
          NUMBER: ${{ steps.change.outputs.number }}
          STATE: ${{ steps.change.outputs.state }}
          URL: ${{ steps.change.outputs.url }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          problem=""
          [ "$STATE" = open ] || problem="is ${STATE:-unknown}, not open"
          text=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${NUMBER}" \
                   --jq '[.title, (.body // "")] | join("\n")' 2>/dev/null) \
            || { echo "::error::${ID}: cannot read the change request from GitHub — CAB validation could not run"; exit 1; }
          comments=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${NUMBER}/comments?per_page=100" \
                       --jq '.[].body // ""' 2>/dev/null) || comments=""
          if ! grep -qiF "$RUN_URL" <<<"${text}${comments}" \
             && ! grep -qiE "(^|[^0-9a-f])${SOURCE_SHA:0:7}" <<<"${text}${comments}"; then
            problem="${problem:+${problem}; }does not name this release (${SOURCE_SHA:0:7} or ${RUN_URL})"
          fi
          if [ -n "$problem" ]; then
            echo "::error::${ID} ${problem} — a release needs an OPEN change request naming it. Add the release reference (${SOURCE_SHA:0:7} or ${RUN_URL}) to ${URL}, or start the release for the change it belongs to."
            exit 1
          fi
          echo "${ID}: open, and names this release (${SOURCE_SHA:0:7})" | tee -a "$GITHUB_STEP_SUMMARY"
      - id: sod
        name: Separation of duties
        # Whoever started (or re-ran) this run, and whoever authored the
        # change being released (its pull request and commits — never the
        # merge commit), can't be its approver; the single-operator waiver
        # is admin-gated inside approvals.sh. The dashboard checks the same
        # thing independently, from GitHub rather than this artifact.
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          ALLOW_SELF_APPROVAL: ${{ inputs.allow-self-approval || vars.ALLOW_SELF_APPROVAL }}
        run: bash .github/scripts/approvals.sh release-approval
      - env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-request"
          jq -n --arg change "$CHANGE_ID" --arg subject "$DIGEST" --arg sha "$GITHUB_SHA" \
            '{change_id: $change, subject: $subject, commit_sha: $sha}' | tee "$RUNNER_TEMP/release-request/release-request.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-request
          path: ${{ runner.temp }}/release-request/release-request.json
          if-no-files-found: error
          retention-days: 30
      - name: Wait for the dashboard's G4 decision
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # Only a status pointing at this run answers this request; an older
        # G4 status on the same commit belongs to another release.
        run: |
          set -uo pipefail
          for _ in $(seq 60); do
            s=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/statuses?per_page=100" \
                  --jq "[.[] | select(.context == \"security-dashboard/G4\" and .target_url == \"${RUN_URL}\")][0] // empty" 2>/dev/null)
            case "$(jq -r '.state // empty' <<<"${s:-null}")" in
              success) echo "G4: $(jq -r .description <<<"$s")"; exit 0 ;;
              failure|error) echo "::error::$(jq -r '.description // "G4 blocked"' <<<"$s")"; exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::dashboard collector did not answer within 20 minutes (no security-dashboard/G4 status for this run)"
          exit 1

  provenance:
    # Both stores, and the provenance must name this exact commit — a valid
    # attestation for some other build of main isn't enough.
    needs: g4
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      attestations: read
    outputs:
      result: ${{ steps.verdict.outputs.result }}
    env:
      DIGEST: ${{ needs.g4.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.6.5
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fail=""
          if cosign verify-attestation --type slsaprovenance1 --certificate-identity-regexp "$CERT_IDENTITY_REGEXP" \
               --certificate-oidc-issuer "$CERT_ISSUER" "${IMAGE}@${DIGEST}" > slsa.jsonl 2>/dev/null; then
            jq -r '.payload | @base64d | fromjson | .predicate.buildDefinition.resolvedDependencies[]?.digest.gitCommit // empty' slsa.jsonl \
              | grep -qx "$GITHUB_SHA" || fail="$fail slsa-commit-mismatch"
          else
            fail="$fail cosign-slsaprovenance1"
          fi
          gh attestation verify "oci://${IMAGE}@${DIGEST}" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/devsecops-build.yml" >/dev/null || fail="$fail gh-attestation"
          if [ -z "$fail" ]; then
            { echo "status=pass"; echo "detail=cosign slsaprovenance1 (devsecops-build.yml@refs/heads/main, commit ${GITHUB_SHA:0:7}) and gh attestation verify both passed"; } >> "$GITHUB_OUTPUT"
          else
            { echo "status=fail"; echo "detail=provenance verification failed:${fail}"; } >> "$GITHUB_OUTPUT"
          fi
      - id: verdict
        if: always()
        env:
          STATUS: ${{ steps.check.outputs.status }}
          DETAIL: ${{ steps.check.outputs.detail || 'verification did not run' }}
        run: python3 .github/scripts/verdict.py result "$STATUS" "$DETAIL"

  config:
    # The target config is controlled: the render is schema-valid and the
    # only change vs git is the image digest.
    needs: g4
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      result: ${{ steps.verdict.outputs.result }}
    env:
      DIGEST: ${{ needs.g4.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        run: |
          set -uo pipefail
          python3 .github/scripts/set_digest.py deploy/kind/kustomization.yaml "$DIGEST" || exit 0
          mkdir -p render
          kubectl kustomize deploy/kind > render/kind.yaml || exit 0
          grep -q "image: ${IMAGE}@${DIGEST}" render/kind.yaml || { echo "::error::render does not reference the released digest"; exit 0; }
          # Rollout/AnalysisTemplate schemas from the datreeio CRDs catalog;
          # -strict rejects unknown fields instead of ignoring them.
          docker run --rm -v "$PWD/render:/render:ro" ghcr.io/yannh/kubeconform:v0.8.0 \
            -strict -summary -output json -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /render/kind.yaml > render/kubeconform.json
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          echo "changed=$(git status --porcelain | awk '{print $2}' | grep -v '^render/' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      - id: verdict
        if: always()
        env:
          RC: ${{ steps.check.outputs.rc }}
          CHANGED: ${{ steps.check.outputs.changed }}
        run: python3 .github/scripts/verdict.py kubeconform render/kubeconform.json

  deploy:
    # The only write path to the cluster: a commit on main that Argo CD
    # syncs. [skip ci] keeps it from re-running G2 (deploy/** is also
    # path-ignored there).
    needs: [g4, provenance, config]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      result: ${{ steps.verdict.outputs.result }}
      gitops-sha: ${{ steps.commit.outputs.gitops_sha }}
    env:
      DIGEST: ${{ needs.g4.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - id: commit
        run: |
          set -euo pipefail
          python3 .github/scripts/set_digest.py deploy/kind/kustomization.yaml "$DIGEST"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/kind/kustomization.yaml
          if git diff --cached --quiet; then
            # Idempotent re-deploy: this digest is already pinned (a re-run
            # of the same release, or a promotion of what it already runs).
            # There is nothing to commit, and an empty `git commit` would
            # fail the job — so carry forward the commit that put this digest
            # there, which is what the deployment event and post-deploy then
            # refer to.
            gitops_sha=$(git log -1 --format=%H -- deploy/kind/kustomization.yaml)
            echo "deploy/kind already pins ${DIGEST:0:19}… (${gitops_sha:0:7}) — nothing to commit"
            echo "gitops_sha=$gitops_sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "deploy(kind): alienbank ${DIGEST:7:12} ${CHANGE_ID} [skip ci]" \
            -m "Released ${IMAGE}@${DIGEST} from ${GITHUB_SHA} by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git push origin HEAD:main
          echo "gitops_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: verdict
        if: always()
        env:
          SHA: ${{ steps.commit.outputs.gitops_sha }}
        run: |
          if [ -n "$SHA" ]; then
            python3 .github/scripts/verdict.py result pass "GitOps commit ${SHA:0:7} → Argo CD app alienbank-kind"
          else
            python3 .github/scripts/verdict.py result fail "GitOps commit/push to main failed"
          fi
      - name: Build deployment-event
        if: steps.commit.outputs.gitops_sha != ''
        env:
          GITOPS_SHA: ${{ steps.commit.outputs.gitops_sha }}
          KIND: ${{ inputs.kind }}
        # in_progress: the commit is only the start. Argo CD notifications
        # report the sync/canary outcome under the same external_id
        # (deploy-<dashboard.environment>-<revision>).
        run: |
          mkdir -p "$RUNNER_TEMP/deployment-event"
          jq -n \
            --arg id "deploy-kind-${GITOPS_SHA}" --arg change "$CHANGE_ID" --arg sha "$GITHUB_SHA" \
            --arg digest "$DIGEST" --arg commit_at "$(git show -s --format=%cI "$GITHUB_SHA")" \
            --arg started "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg kind "$KIND" \
            --arg run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{external_id: $id, environment: "kind", change_id: $change, commit_sha: $sha,
              artifact_digest: $digest, commit_at: $commit_at, started_at: $started,
              status: "in_progress", kind: $kind, via_approved_path: true, break_glass: false,
              run_url: $run}' | tee "$RUNNER_TEMP/deployment-event/deployment.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.commit.outputs.gitops_sha != ''
        with:
          name: deployment-event
          path: ${{ runner.temp }}/deployment-event/deployment.json
          if-no-files-found: error
          retention-days: 30

  gate-g5:
    name: G5 deployment gate
    needs: [g4, provenance, config, deploy]
    if: always() && needs.g4.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - uses: ./.github/actions/gate
        with:
          gate: G5
          needs: ${{ toJSON(needs) }}
          subject: ${{ needs.g4.outputs.digest }}
          artifact-digest: ${{ needs.g4.outputs.digest }}
          environment: kind
          started-at: ${{ needs.g4.outputs.started-at }}

  post-deploy:
    name: Deploy · verify the rollout (G6 status)
    # Argo CD reports G6 (sync, canary analysis, Kyverno admission) to the
    # dashboard; the dashboard mirrors it as commit status
    # `security-dashboard/G6` on the deploy commit. This repo deploys to the
    # one `kind` environment, so the BARE context is the right one (the
    # per-environment `security-dashboard/G6/<env>` form is for the
    # multi-target ladder that does not apply here — see the security
    # dashboard's backend/app/g6_statuses.py). A GitHub-hosted runner can't
    # see the cluster, so this is how the release learns the outcome.
    needs: [deploy]
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      statuses: read
    outputs:
      result: ${{ steps.verdict.outputs.result }}
    env:
      GITOPS_SHA: ${{ needs.deploy.outputs.gitops-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - id: wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          mkdir -p reports/post-deploy
          context="security-dashboard/G6"
          for _ in $(seq 90); do
            s=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITOPS_SHA}/statuses?per_page=100" \
                  --jq "[.[] | select(.context == \"${context}\")][0] // empty" 2>/dev/null)
            state=$(jq -r '.state // empty' <<<"${s:-null}")
            desc=$(jq -r '.description // ""' <<<"${s:-null}")
            if [ "$state" = success ] || [ "$state" = failure ] || [ "$state" = error ]; then
              jq . <<<"$s" > "reports/post-deploy/g6-status.json"
              { echo "status=$([ "$state" = success ] && echo pass || echo fail)"
                echo "detail=G6 ${state}: ${desc} ($(jq -r '.target_url // ""' <<<"$s"))"; } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 20
          done
          { echo "status=fail"; echo "detail=no ${context} status on ${GITOPS_SHA:0:7} within 30 minutes (Argo CD sync or notification didn't reach the dashboard)"; } >> "$GITHUB_OUTPUT"
      - id: verdict
        if: always()
        env:
          STATUS: ${{ steps.wait.outputs.status }}
          DETAIL: ${{ steps.wait.outputs.detail || 'wait did not run' }}
        run: python3 .github/scripts/verdict.py result "$STATUS" "$DETAIL"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-kind-post-deploy
          path: reports/post-deploy/
          if-no-files-found: ignore

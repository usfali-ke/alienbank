# Unit tests: every discovered test passes (zero tests is a fail).
name: control-unit-tests
on:
  workflow_call:
    outputs:
      result:
        description: verdict JSON {status, detail, metrics} (.github/scripts/verdict.py)
        value: ${{ jobs.control.outputs.result }}
jobs:
  control:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.verdict.outputs.result }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
      - id: run
        run: |
          rc=0
          { uv sync --frozen --group dev && uv run --frozen pytest tests/unit --junitxml=junit-unit.xml; } || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - id: verdict
        if: always()
        env:
          RC: ${{ steps.run.outputs.rc }}
          LABEL: pytest tests/unit
        run: python3 .github/scripts/verdict.py tests junit-unit.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evidence-unit-tests
          path: junit-unit.xml
          if-no-files-found: ignore

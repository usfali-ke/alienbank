# SCA: no fixable Critical/High in the resolved dependencies (uv.lock —
# exactly what the image installs with uv sync --frozen).
name: control-sca
on:
  workflow_call:
    outputs:
      result:
        description: verdict JSON {status, detail, metrics} (.github/scripts/verdict.py)
        value: ${{ jobs.control.outputs.result }}
jobs:
  control:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.verdict.outputs.result }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          docker run --rm -v "$PWD:/work" -w /work aquasec/trivy:0.74.0 fs --scanners vuln \
            --severity CRITICAL,HIGH --format json --output /work/trivy-sca.json --exit-code 0 . || true
      - id: verdict
        if: always()
        run: python3 .github/scripts/verdict.py trivy trivy-sca.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evidence-sca
          path: trivy-sca.json
          if-no-files-found: ignore

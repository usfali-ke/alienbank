# DAST: no High alerts in a ZAP passive baseline of the unauthenticated
# surface (login page, redirects, headers, static assets).
name: control-dast
on:
  workflow_call:
    inputs:
      image:
        description: image@sha256:… under test (the G2 digest)
        type: string
        required: true
    outputs:
      result:
        description: verdict JSON {status, detail, metrics} (.github/scripts/verdict.py)
        value: ${{ jobs.control.outputs.result }}
jobs:
  control:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.verdict.outputs.result }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: app
        uses: ./.github/actions/start-app
        with:
          image: ${{ inputs.image }}
      - env:
          TARGET_URL: ${{ steps.app.outputs.url }}
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:2.17.0 \
            zap-baseline.py -t "$TARGET_URL" -J zap.json -I -m 2 || true
      - id: verdict
        if: always()
        run: python3 .github/scripts/verdict.py zap zap/zap.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evidence-dast
          path: zap/zap.json
          if-no-files-found: ignore
